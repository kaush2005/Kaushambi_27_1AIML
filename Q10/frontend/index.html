<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Q10 MongoDB Product CRUD</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Product Management – MongoDB</h1><form id="productForm"><input type="hidden" id="productId"><label>Name<input id="name" required></label><label>Price<input id="price" type="number" min="0.01" step="0.01" required></label><label>Description<input id="description" required></label><button type="submit" id="saveButton">Add Product</button><button type="button" id="cancelButton" hidden>Cancel Edit</button></form><p id="message" role="status"></p><h2>Products</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Price</th><th>Description</th><th>Actions</th></tr></thead><tbody id="productList"></tbody></table></div></main><script src="app.js"></script></body></html>
