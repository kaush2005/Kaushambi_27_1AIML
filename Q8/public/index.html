<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Q8 - Product API</title><link rel="stylesheet" href="style.css"></head>
<body><main class="container"><h1>Product Management</h1><section class="panel"><h2>Add New Product</h2><form id="productForm"><label>Product name<input id="name" required maxlength="80" placeholder="Enter product name"></label><label>Price (₹)<input id="price" type="number" min="0.01" step="0.01" required></label><label>Rating (0–5)<input id="rating" type="number" min="0" max="5" step="0.1" required></label><button type="submit">Add Product</button></form><p id="message" role="status"></p></section><section><h2>All Products</h2><div id="productList" class="grid" aria-live="polite"></div></section></main><script src="app.js"></script></body></html>
