<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Search Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎓 University Finder</h1>
        <p class="subtitle">Search universities across the world by country</p>
        <!-- Search Bar Section -->
        <div class="search-box">
            <input 
                type="text" 
                id="countryInput" 
                placeholder="Enter country (e.g. India, United States, Japan)..."
            />
            <button id="searchBtn" onclick="getUniversity()">Search</button>
        </div>
        <!-- Status message (Loading / Error / Count) -->
        <div id="statusMessage"></div>
        <!-- Universities Table Display -->
        <div class="table-container">
            <table id="universityTable" style="display: none;">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>University Name</th>
                        <th>State / Province</th>
                        <th>Website</th>
                    </tr>
                </thead>
                <tbody id="universityList">
                    <!-- Dynamic rows will be inserted here by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
